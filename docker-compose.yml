services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: airport_db
      POSTGRES_USER: stepan
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: config/Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: airport_db
      DB_USER: stepan
      DB_PASSWORD: admin
      DB_PORT: 5432
    depends_on:
      - db

volumes:
  postgres_data: