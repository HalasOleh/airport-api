<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 760px;
        }

        textarea {
            width: 100%;
            min-height: 220px;
            margin-top: 16px;
            padding: 12px;
            font-family: Consolas, monospace;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px 14px;
        }

        .row {
            margin-bottom: 12px;
        }

        .hidden {
            display: none;
        }

        #who {
            color: #555;
        }

        #checkoutLink {
            display: inline-block;
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 6px;
            background: #635bff;
            color: white;
            text-decoration: none;
        }

        #checkoutLink.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>WebSocket Test</h1>

    {% csrf_token %}

    <div id="auth" class="hidden">
        <div class="row">
            <label>Email:</label>
            <input id="email" type="email" style="width:260px; margin-left:8px;" autocomplete="username" />
        </div>
        <div class="row">
            <label>Password:</label>
            <input id="password" type="password" style="width:260px; margin-left:8px;" autocomplete="current-password" />
            <button id="login">Log in</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <div class="row">
            <span id="who"></span>
            <button id="logout" style="margin-left:12px;">Log out</button>
        </div>

        <div class="row">
            <label>Dialog ID:</label>
            <input id="dialogId" style="width:120px; margin-left:8px;" placeholder="1" />
            <button id="createDialog">Create dialog</button>
            <button id="connect">Connect</button>
        </div>

        <div class="row">
            <label>Provider:</label>
            <button class="provider-btn" data-provider="gemini">gemini</button>
            <button class="provider-btn" data-provider="openai">openai</button>
            <span style="margin-left:12px;">or type:</span>
            <input id="provider" value="" style="width:120px; margin-left:8px;" placeholder="custom provider" />
            <button id="setProvider">Set provider</button>
        </div>

        <input id="message" value="Tell me about airports" style="width:70%;">
        <button id="send">Send message</button>
    </div>

    <textarea id="log" readonly></textarea>
    <div>
        <a id="checkoutLink" class="hidden" target="_blank" rel="noopener noreferrer">
            Open secure Stripe Checkout
        </a>
    </div>

    <script>
        // The JWT lives in an httpOnly cookie. This page cannot read it, cannot
        // store it and cannot put it in a URL - the browser attaches it to every
        // request to this origin on its own, WebSocket handshake included. All
        // the token bookkeeping that used to live here is gone as a result.
        const LOGIN_URL = "/api/user/login/";
        const LOGOUT_URL = "/api/user/logout/";
        const ME_URL = "/api/user/me/";
        const DIALOGS_URL = "/api/chat/dialogs/";

        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        let socket = null;
        let providerSelected = false;

        const log = document.getElementById("log");
        const authBox = document.getElementById("auth");
        const appBox = document.getElementById("app");
        const who = document.getElementById("who");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const dialogIdInput = document.getElementById("dialogId");
        const messageInput = document.getElementById("message");
        const providerInput = document.getElementById("provider");
        const setProviderBtn = document.getElementById("setProvider");
        const providerButtons = document.querySelectorAll(".provider-btn");
        const checkoutLink = document.getElementById("checkoutLink");

        function writeLog(message) {
            log.value += `${message}\n`;
            log.scrollTop = log.scrollHeight;
        }

        function plainTextReply(reply) {
            return reply.replaceAll("**", "").replaceAll("`", "");
        }

        // --- requests ------------------------------------------------------

        function getCsrfToken() {
            const field = document.querySelector("[name=csrfmiddlewaretoken]");
            return field ? field.value : "";
        }

        // credentials: "same-origin" is what sends the cookie. X-CSRFToken is
        // required because a cookie is attached to cross-site requests too, so
        // the server needs proof the request came from our own page.
        function api(url, options = {}) {
            return fetch(url, {
                ...options,
                credentials: "same-origin",
                headers: {
                    ...(options.headers || {}),
                    "X-CSRFToken": getCsrfToken(),
                    "Content-Type": "application/json",
                },
            });
        }

        // --- screens -------------------------------------------------------

        function showLogin(reason) {
            if (reason) writeLog(reason);
            authBox.classList.remove("hidden");
            appBox.classList.add("hidden");
            emailInput.focus();
        }

        function showApp(user) {
            who.textContent = `Signed in as ${user.email} (id ${user.id})`;
            authBox.classList.add("hidden");
            appBox.classList.remove("hidden");
        }

        // --- dialogs and socket --------------------------------------------

        async function createDialog() {
            const response = await api(DIALOGS_URL, {
                method: "POST",
                body: JSON.stringify({ title: "WebSocket test chat" }),
            });

            const data = await response.json();
            if (!response.ok) {
                writeLog(`Create dialog failed: ${JSON.stringify(data)}`);
                return null;
            }

            dialogIdInput.value = data.id;
            writeLog(`Dialog created: ${data.id}`);
            return data.id;
        }

        function connectSocket() {
            const dialogId = dialogIdInput.value.trim();
            if (!dialogId) {
                writeLog("Create a dialog or enter a dialog id first.");
                return;
            }

            // No ?token= any more: the cookie rides along with the handshake.
            socket = new WebSocket(
                `${protocol}://${window.location.host}/ws/chat/${dialogId}/`
            );

            socket.onopen = () => {
                writeLog("Connected");
                writeLog('Step 1: choose provider and click "Set provider"');
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.history) {
                    writeLog(`History loaded: ${data.history.length} messages`);
                } else if (data.status) {
                    writeLog(`Status: ${data.status}`);
                    providerSelected = true;
                    setProviderEnabled(false);
                    writeLog('Now send messages (Step 2) using the "Send message" button');
                } else if (data.error) {
                    writeLog(`Error: ${data.error}`);
                    providerSelected = false;
                    setProviderEnabled(true);
                } else if (data.reply || data.checkout_url) {
                    if (data.reply) {
                        writeLog(`Reply: ${plainTextReply(data.reply)}`);
                    }
                    if (data.checkout_url) {
                        try {
                            const checkoutUrl = new URL(data.checkout_url);
                            if (checkoutUrl.protocol === "https:") {
                                checkoutLink.href = checkoutUrl.href;
                                checkoutLink.classList.remove("hidden");
                                writeLog("Secure Stripe Checkout link is ready.");
                            }
                        } catch (error) {
                            writeLog("The Checkout link returned by the server is invalid.");
                        }
                    }
                } else {
                    writeLog(`Reply: ${JSON.stringify(data)}`);
                }
            };

            socket.onerror = (e) => {
                writeLog("WebSocket error");
                console.error(e);
            };

            socket.onclose = () => {
                writeLog("Disconnected");
                providerSelected = false;
                setProviderEnabled(true);
            };
        }

        function setProviderEnabled(enabled) {
            providerInput.disabled = !enabled;
            setProviderBtn.disabled = !enabled;
            providerButtons.forEach(btn => btn.disabled = !enabled);
        }

        function sendProvider(provider) {
            if (!provider) return;
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                writeLog("Connect WebSocket first.");
                return;
            }
            socket.send(JSON.stringify({ provider }));
            writeLog(`Trying provider: ${provider}`);
        }

        // --- startup -------------------------------------------------------

        async function autoStart(user) {
            showApp(user);
            if (!dialogIdInput.value.trim() && !(await createDialog())) return;
            connectSocket();
        }

        async function init() {
            // The browser restores field values on reload; start from a clean log.
            log.value = "";
            dialogIdInput.value = "";

            // The only way to find out whether we are signed in: ask the server.
            // The page cannot inspect an httpOnly cookie, and that is the point.
            const response = await api(ME_URL);
            if (response.ok) {
                return autoStart(await response.json());
            }

            writeLog(`Not signed in (${ME_URL} returned ${response.status}).`);
            showLogin("Please log in.");
        }

        document.getElementById("login").addEventListener("click", async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                writeLog("Email and password are required.");
                return;
            }

            const response = await api(LOGIN_URL, {
                method: "POST",
                body: JSON.stringify({ email, password }),
            });

            const data = await response.json();
            if (!response.ok) {
                writeLog(`Login failed: ${JSON.stringify(data)}`);
                return;
            }

            passwordInput.value = "";
            writeLog("Logged in, cookie set by the server.");
            init();
        });

        document.getElementById("logout").addEventListener("click", async () => {
            // Only the server can clear an httpOnly cookie.
            await api(LOGOUT_URL, { method: "POST" });
            if (socket) socket.close();
            writeLog("Logged out.");
            showLogin();
        });

        document.getElementById("createDialog").addEventListener("click", createDialog);
        document.getElementById("connect").addEventListener("click", connectSocket);

        providerButtons.forEach(button => {
            button.addEventListener("click", () => sendProvider(button.dataset.provider));
        });

        setProviderBtn.addEventListener("click", () => {
            sendProvider(providerInput.value.trim());
        });

        document.getElementById("send").addEventListener("click", () => {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                writeLog("Connect WebSocket first.");
                return;
            }
            if (!providerSelected) {
                writeLog("Please choose a valid provider first.");
                return;
            }
            const msg = messageInput.value;
            checkoutLink.classList.add("hidden");
            checkoutLink.removeAttribute("href");
            socket.send(JSON.stringify({ message: msg }));
            writeLog(`Sent: ${msg}`);
        });

        init();
    </script>
</body>
</html>
