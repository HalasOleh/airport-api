[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests

# Every test that touches the ORM must ask for it explicitly with
# @pytest.mark.django_db. Without that rule a test can pass by accident
# against rows left behind by another test.
addopts = --strict-markers -q

# asyncio_mode=auto lets async test functions run without a decorator on each
# one - the consumer tests are all coroutines.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
